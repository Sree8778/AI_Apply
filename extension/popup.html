<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(28, 28, 30, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #af52de;
      --primary-glow: rgba(175, 82, 222, 0.25);
      --text: #ffffff;
      --text-muted: #8e8e93;
      --success: #34c759;
      --error: #ff3b30;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #af52de 0%, #ff2d55 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--error);
      box-shadow: 0 0 8px var(--error);
    }

    .status-dot.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .profile-info {
      font-size: 14px;
      font-weight: 600;
    }

    .profile-email {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn {
      width: 100%;
      box-sizing: border-box;
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .btn:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 6px 16px var(--primary-glow);
      opacity: 0.95;
    }

    .btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .console {
      background: #020617;
      border: 1px solid var(--glass-border);
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 10px;
      height: 120px;
      overflow-y: auto;
      display: none;
      box-sizing: border-box;
    }

    .log-entry {
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .log-entry.info { color: #38bdf8; }
    .log-entry.success { color: var(--success); }
    .log-entry.error { color: var(--error); }
    .log-entry.warn { color: #f59e0b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">AI-Apply Pro</div>
    <div class="status-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Disconnected</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Candidate Profile</div>
    <div id="profileInfo">
      <span style="color: var(--text-muted); font-size: 12px;">Sync from dashboard at localhost:5173</span>
    </div>
  </div>

  <div class="card" id="jobSection" style="display: none;">
    <div class="card-title">Job Detected</div>
    <div id="detectedJobTitle" style="font-weight: 600; font-size: 13px;">Unknown Job</div>
    <div id="detectedJobSource" style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Platform</div>
  </div>

  <div class="card" id="syncJobCard">
    <div class="card-title">Target Job Context</div>
    <button id="syncJobBtn" class="btn" style="background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); font-size: 12px; padding: 8px; box-shadow: none;">
      <span>🎯 Sync Job Target to App</span>
    </button>
  </div>

  <div class="card" style="margin-bottom: 14px;">
    <div class="card-title">Automation Mode</div>
    <select id="appModeSelect" style="width: 100%; box-sizing: border-box; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); border-radius: 6px; padding: 8px; color: var(--text-main); font-size: 12px; margin-top: 6px; outline: none; cursor: pointer;">
      <option value="manual">Manual (Contact details + Resume only)</option>
      <option value="hybrid" selected>Hybrid (Review filled questions)</option>
      <option value="auto">Auto (Full Auto-Submit)</option>
    </select>
  </div>

  <div style="margin-bottom: 14px;">
    <button id="autofillBtn" class="btn" disabled>
      <span>Auto-Fill Form</span>
    </button>
  </div>

  <div class="card" id="buddyCard" style="margin-bottom: 14px;">
    <div class="card-title">Live Interview Assist</div>
    <button id="buddyToggleBtn" class="btn" style="background: rgba(168, 85, 247, 0.1); color: #a855f7; border: 1px solid rgba(168, 85, 247, 0.3); font-size: 12px; padding: 8px; margin-top: 6px; box-shadow: none;">
      <span>🎙 Start Voice Assist</span>
    </button>
    <div id="buddyTranscription" style="font-size: 11px; color: var(--success); font-style: italic; margin-top: 8px; display: none; word-wrap: break-word;">
      Listening for recruiter question...
    </div>
    <div id="buddyHintsContainer" style="margin-top: 8px; display: none;">
      <div style="font-size: 10px; text-transform: uppercase; color: var(--primary); font-weight: bold; margin-bottom: 4px;">Live Response Hints:</div>
      <ul id="buddyHints" style="font-size: 11px; color: var(--text-main); padding-left: 16px; margin: 0; line-height: 1.4;">
      </ul>
    </div>
  </div>

  <div style="margin-bottom: 14px;">
    <button id="resetBlacklistBtn" class="btn" style="background: rgba(255, 45, 85, 0.1); color: #ff2d55; border: 1px solid rgba(255, 45, 85, 0.3); font-size: 11px; padding: 6px; box-shadow: none;">
      Reset Hidden Sites
    </button>
  </div>

  <div id="consoleBox" class="console"></div>
  <script src="popup.js"></script>
</body>
</html>
